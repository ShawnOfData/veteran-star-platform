# ===== 设备识别：手机设备 → 移动端学生前端；桌面设备 → 桌面端前端（管理端+学生端） =====
map $http_user_agent $is_mobile {
    default 0;
    ~*android|iphone|ipad|ipod|mobile|windows\s?phone|harmonyos|MicroMessenger 1;
}

server {
    listen 80;
    server_name _;

    # 桌面端前端静态资源（管理端 + 学生端桌面版）
    root /usr/share/nginx/html;
    index index.html;

    # 上传文件大小限制（与后端 spring.servlet.multipart.max-file-size 对齐）
    client_max_body_size 20m;

    # ===== 移动端前端（学生端移动网页，构建 base=/mobile/） =====
    # 手机设备访问的主路径；^~ 阻止下方正则资源 location 接管 /mobile/ 下的资源
    location ^~ /mobile/ {
        alias /usr/share/nginx/html-mobile/;
        index index.html;
        try_files $uri $uri/ /mobile/index.html;
    }

    # ===== 前端 SPA 路由（history 模式） =====
    location / {
        # 手机设备：将任意路径内部重写到 /mobile/ 前缀 → 走移动端前端
        # 管理端 /admin/**、上传 /uploads/**、接口 /api/** 不受影响（更精确的前缀 location 优先）
        if ($is_mobile = 1) {
            rewrite ^/(?!mobile/)(.*)$ /mobile/$1 last;
        }
        try_files $uri $uri/ /index.html;
    }

    # ===== 上传文件静态服务（头像、PDF、证明材料） =====
    # 直接由 nginx 提供，不走后端，减少 app 压力
    # 使用 ^~ 前缀修饰符，阻止下方的 \.(jpg|png) 正则 location 抢走 /uploads/ 下的图片请求
    # 否则 /uploads/avatars/xxx.jpg 会被正则匹配，走 server.root=/usr/share/nginx/html → 404
    location ^~ /uploads/ {
        alias /data/veteran/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ===== 后端 API 反向代理（统一 /api 前缀） =====
    # 所有 REST 接口已统一加 /api 前缀，前端通过 axios baseURL='/api' 访问
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    # ===== 管理端 SPA 页面（/admin/login、/admin/dashboard 等） =====
    # 不再转发到后端，避免与后端 /api/admin/** 接口冲突导致 405 错误
    location /admin/ {
        try_files $uri $uri/ /index.html;
    }

    # ===== 学生端 SPA 页面 =====
    location /app/ {
        try_files $uri $uri/ /index.html;
    }

    # ===== API 文档（生产环境可选，建议注释掉） =====
    location /swagger-ui.html {
        proxy_pass http://app:8080;
    }
    location /v3/api-docs {
        proxy_pass http://app:8080;
    }
    location /doc.html {
        proxy_pass http://app:8080;
    }
    location /webjars/ {
        proxy_pass http://app:8080;
    }

    # ===== 健康检查 =====
    location /actuator/health {
        proxy_pass http://app:8080;
        access_log off;
    }

    # ===== gzip 压缩 =====
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_disable "msie6";

    # ===== 安全头 =====
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ===== 静态资源缓存 =====
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
