<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; font-family: 'SimSun', '宋体', serif; font-size: 12pt; line-height: 1.8; }
  .page { width: 100%; padding: 0 30px; box-sizing: border-box; }

  .header { background: #1a1a2e; color: #c4a35a; padding: 25px 30px; margin-bottom: 0; display: flex; align-items: center; gap: 20px; }
  .header .avatar-img { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #c4a35a; object-fit: cover; }
  .header .name { font-size: 22pt; font-weight: bold; color: #fff; }
  .header .meta { font-size: 10pt; color: #aaa; margin-top: 6px; }
  .header .level { display: inline-block; background: #c4a35a; color: #1a1a2e; padding: 3px 14px; font-weight: bold; margin-top: 8px; border-radius: 2px; }

  .section-title { background: #1a1a2e; color: #c4a35a; padding: 6px 12px; font-size: 13pt; font-weight: bold; margin: 18px 0 10px 0; }

  .info-grid { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  .info-grid td { padding: 4px 8px; vertical-align: top; }
  .info-grid .label { color: #888; width: 80px; white-space: nowrap; font-size: 10pt; }
  .info-grid .value { color: #333; font-size: 10pt; }

  .item-list { width: 100%; }
  .item { padding: 8px 0; border-bottom: 1px dashed #ddd; }
  .item .title { font-weight: bold; color: #333; font-size: 11pt; }
  .item .sub { color: #666; font-size: 10pt; margin-left: 6px; }
  .item .date { color: #999; font-size: 9pt; float: right; }

  .tag { display: inline-block; background: #e8e0d0; color: #5c4a2a; padding: 2px 10px; margin: 3px; font-size: 9pt; border-radius: 2px; }
  .tag-skill { display: inline-block; background: #1a1a2e; color: #c4a35a; padding: 2px 10px; margin: 3px; font-size: 9pt; border-radius: 2px; }

  .quote { background: #f8f6f0; border-left: 3px solid #c4a35a; padding: 12px 16px; margin: 12px 0; color: #555; font-size: 10pt; }

  .personal-summary { background: #f8f6f0; border-left: 3px solid #1a1a2e; padding: 12px 16px; margin: 12px 0; color: #555; font-size: 10pt; }

  .footer { border-top: 2px solid #1a1a2e; padding-top: 12px; margin-top: 24px; color: #888; font-size: 9pt; text-align: center; }
</style>
</head>
<body>
<div class="page">

  <!-- ===== 头部 ===== -->
  <div class="header">
    <img th:if="${avatarUrl != null and !avatarUrl.isEmpty()}" class="avatar-img" th:src="@{${avatarUrl}}" alt="头像" />
    <div>
      <div class="name" th:text="${basicName} + ' · 个人简历'">姓名 · 个人简历</div>
      <div class="meta">
        <span th:text="${basic.studentNo}">学号</span> &nbsp;|&nbsp;
        <span th:text="${basicCollege}">学院</span> &nbsp;|&nbsp;
        <span th:text="${basicMajor}">专业</span> &nbsp;|&nbsp;
        <span th:text="${basicGrade}">年级</span>
      </div>
    </div>
  </div>

  <!-- ===== 联系方式 ===== -->
  <table class="info-grid" th:if="${phone != null and !phone.isEmpty()} or ${email != null and !email.isEmpty()}">
    <tr>
      <td class="label" th:if="${phone != null and !phone.isEmpty()}">手机</td>
      <td class="value" th:if="${phone != null and !phone.isEmpty()}" th:text="${phone}"></td>
      <td class="label" th:if="${email != null and !email.isEmpty()}">邮箱</td>
      <td class="value" th:if="${email != null and !email.isEmpty()}" th:text="${email}"></td>
    </tr>
  </table>

  <!-- ===== 个人简介 ===== -->
  <div th:if="${personalSummary != null and !personalSummary.isEmpty()}">
    <div class="section-title">个人简介</div>
    <div class="personal-summary" th:text="${personalSummary}"></div>
  </div>

  <!-- ===== 求职意向 ===== -->
  <div th:if="${expectedJob != null and !expectedJob.isEmpty()} or ${expectedCity != null and !expectedCity.isEmpty()} or ${expectedSalary != null and !expectedSalary.isEmpty()}">
    <div class="section-title">求职意向</div>
    <table class="info-grid">
      <tr>
        <td class="label" th:if="${expectedJob != null and !expectedJob.isEmpty()}">期望岗位</td>
        <td class="value" th:if="${expectedJob != null and !expectedJob.isEmpty()}" th:text="${expectedJob}"></td>
        <td class="label" th:if="${expectedCity != null and !expectedCity.isEmpty()}">期望城市</td>
        <td class="value" th:if="${expectedCity != null and !expectedCity.isEmpty()}" th:text="${expectedCity}"></td>
        <td class="label" th:if="${expectedSalary != null and !expectedSalary.isEmpty()}">期望薪资</td>
        <td class="value" th:if="${expectedSalary != null and !expectedSalary.isEmpty()}" th:text="${expectedSalary}"></td>
      </tr>
    </table>
  </div>

  <!-- ===== 技能标签 ===== -->
  <div th:if="${skills != null and !skills.isEmpty()}">
    <div class="section-title">专业技能</div>
    <span th:each="s : ${skills}" class="tag-skill" th:text="${s}">技能</span>
  </div>

  <!-- ===== 服役经历 ===== -->
  <div th:if="${military != null}">
    <div class="section-title">服役经历</div>
    <div class="item">
      <span class="title" th:text="${military.branchName}">兵种</span>
      <span class="sub" th:text="${military.unit}">单位</span>
      <span class="date" th:text="${military.startDate} + ' ~ ' + ${military.endDate}">日期</span>
    </div>
    <table class="info-grid">
      <tr th:if="${military.position != null}">
        <td class="label">服役职务</td>
        <td class="value" th:text="${military.position}">职位</td>
        <td class="label">服役年限</td>
        <td class="value" th:text="${military.serviceYears}">年限</td>
      </tr>
    </table>
  </div>

  <!-- ===== 荣誉奖项 ===== -->
  <div th:if="${showHonors and honors != null and !honors.isEmpty()}">
    <div class="section-title">荣誉奖项</div>
    <div th:each="h : ${honors}" class="item">
      <span class="title" th:text="${h.name}">荣誉名称</span>
      <span class="date" th:text="${h.awardDate}">日期</span>
    </div>
  </div>

  <!-- ===== 技能证书 ===== -->
  <div th:if="${showCerts and certs != null and !certs.isEmpty()}">
    <div class="section-title">技能证书</div>
    <div th:each="c : ${certs}" class="item">
      <span class="title" th:text="${c.name}">证书名称</span>
      <span class="date" th:text="${c.obtainDate}">获取日期</span>
      <span th:if="${c.validUntil != null}" style="color:#888;font-size:9pt;"
            th:text="'有效期至: ' + ${c.validUntil}"></span>
    </div>
  </div>

  <!-- ===== 社会服务 ===== -->
  <div th:if="${showServices and services != null and !services.isEmpty()}">
    <div class="section-title">社会服务</div>
    <div th:each="s : ${services}" class="item">
      <span class="title" th:text="${s.title}">服务标题</span>
      <span class="sub" th:text="${s.hours} + '小时'">时长</span>
      <span class="date" th:text="${s.serviceDate}">日期</span>
    </div>
  </div>

  <!-- ===== 实习经历 ===== -->
  <div th:if="${showInternships and internships != null and !internships.isEmpty()}">
    <div class="section-title">实习经历</div>
    <div th:each="i : ${internships}" class="item">
      <span class="title" th:text="${i.company}">实习单位</span>
      <span th:if="${i.position != null and !i.position.isEmpty()}" class="sub" th:text="${i.position}">职位</span>
      <span th:if="${i.startDate != null and !i.startDate.isEmpty()}" class="date" th:text="${i.startDate} + ' ~ ' + ${i.endDate}">日期</span>
      <div th:if="${i.description != null and !i.description.isEmpty()}" style="color:#666;font-size:10pt;margin-top:4px;line-height:1.6;white-space:pre-wrap;" th:text="${i.description}">描述</div>
    </div>
  </div>

  <!-- ===== 项目经历 ===== -->
  <div th:if="${showProjects and projects != null and !projects.isEmpty()}">
    <div class="section-title">项目经历</div>
    <div th:each="p : ${projects}" class="item">
      <span class="title" th:text="${p.name}">项目名称</span>
      <span th:if="${p.role != null and !p.role.isEmpty()}" class="sub" th:text="${p.role}">角色</span>
      <span th:if="${p.startDate != null and !p.startDate.isEmpty()}" class="date" th:text="${p.startDate} + ' ~ ' + ${p.endDate}">日期</span>
      <div th:if="${p.description != null and !p.description.isEmpty()}" style="color:#666;font-size:10pt;margin-top:4px;line-height:1.6;white-space:pre-wrap;" th:text="${p.description}">描述</div>
    </div>
  </div>

  <!-- ===== 学业表现 ===== -->
  <div th:if="${showAcademic and academic != null and !academic.isEmpty()}">
    <div class="section-title">学业表现</div>
    <div th:each="a : ${academic}" class="item">
      <span class="title" th:text="${a.semester}">学期</span>
      <span class="sub" th:text="${a.gpa}">GPA</span>
      <span th:if="${a.scholarship != null}" class="tag" th:text="${a.scholarship}">奖学金</span>
    </div>
  </div>

  <!-- ===== 就业意向 ===== -->
  <div th:if="${showIntention and intention != null}">
    <div class="section-title">就业意向</div>
    <table class="info-grid">
      <tr th:if="${intention.expectedCity != null}">
        <td class="label">期望城市</td>
        <td class="value" th:text="${intention.expectedCity}">城市</td>
      </tr>
      <tr th:if="${intention.expectedSalary != null}">
        <td class="label">期望薪资</td>
        <td class="value" th:text="${intention.expectedSalary}">薪资</td>
      </tr>
    </table>
    <div th:if="${intention.jobTypes != null}">
      <span th:each="j : ${intention.jobTypes}" class="tag" th:text="${j}">岗位</span>
    </div>
  </div>

  <!-- ===== 自定义模块 ===== -->
  <div th:if="${customSections != null and !customSections.isEmpty()}">
    <div th:each="cs : ${customSections}" th:if="${cs.title != null and !cs.title.isEmpty()}">
      <div class="section-title" th:text="${cs.title}">自定义模块</div>
      <div th:if="${cs.content != null and !cs.content.isEmpty()}" class="personal-summary" style="white-space:pre-wrap;" th:text="${cs.content}">内容</div>
    </div>
  </div>

  <!-- ===== 页脚 ===== -->
  <div class="footer">
    <span th:text="'本简历由戎归·星辉系统自动生成 · ' + ${generatedDate}">页脚信息</span>
  </div>

</div>
</body>
</html>
